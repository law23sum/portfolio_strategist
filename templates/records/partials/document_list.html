<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Year</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for document in documents %}
        <tr>
            <td>{{ document.original_name }}</td>
            <td>{{ document.record_type }}</td>
            <td>{{ document.year }}</td>
            <td>
                {% if document.processed %}
                    <span style="color: green;">Processed</span>
                {% else %}
                    <span style="color: orange;">Processing</span>
                {% endif %}
            </td>
            <td>
                <a href="{{ document.document.url }}" target="_blank">View</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No documents uploaded yet</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
