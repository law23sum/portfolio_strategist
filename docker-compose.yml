services:
  db:
    image: postgres:15
    # persist data beyond lifetime of container
    # Using /var/lib/postgresql for PostgreSQL 18+ compatibility
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=portfolio_strategist
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 2s
      retries: 10
  redis:
    image: redis
    # persistent storage
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: bash -c 'exec 6<>/dev/tcp/redis/6379'
      interval: 2s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "python manage.py migrate --noinput --fake-initial && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      # Local drive access - mount user's home directory
      - ${HOME}:/host/home:rw
      # Cloud drive access - common cloud drive locations
      - ${HOME}/Library/CloudStorage:/host/cloudstorage:rw
      - ${HOME}/Google Drive:/host/googledrive:rw
      - ${HOME}/Dropbox:/host/dropbox:rw
      - ${HOME}/OneDrive:/host/onedrive:rw
      - ${HOME}/iCloud Drive:/host/iclouddrive:rw
      # Additional common locations
      - ${HOME}/Documents:/host/documents:rw
      - ${HOME}/Desktop:/host/desktop:rw
      - ${HOME}/Downloads:/host/downloads:rw
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_DATABASE_HOST=db
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/portfolio_strategist
    env_file:
      - ./.env
    restart: unless-stopped
    # Run as root to ensure full file access permissions
    user: root
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: celery -A portfolio_strategist worker -l INFO --beat --pool=solo
    volumes:
      - .:/code
      # Local drive access - mount user's home directory
      - ${HOME}:/host/home:rw
      # Cloud drive access - common cloud drive locations
      - ${HOME}/Library/CloudStorage:/host/cloudstorage:rw
      - ${HOME}/Google Drive:/host/googledrive:rw
      - ${HOME}/Dropbox:/host/dropbox:rw
      - ${HOME}/OneDrive:/host/onedrive:rw
      - ${HOME}/iCloud Drive:/host/iclouddrive:rw
      # Additional common locations
      - ${HOME}/Documents:/host/documents:rw
      - ${HOME}/Desktop:/host/desktop:rw
      - ${HOME}/Downloads:/host/downloads:rw
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_DATABASE_HOST=db
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/portfolio_strategist
    env_file:
      - ./.env
    # Run as root to ensure full file access permissions
    user: root
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
