      security:
      - cookieAuth: []
      - basicAuth: []
      - tokenAuth: []
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    put:
      operationId: employees_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee.
        required: true
      tags:
      - pegasus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Employee'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Employee'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - tokenAuth: []
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    patch:
      operationId: employees_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee.
        required: true
      tags:
      - pegasus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployee'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployee'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployee'
      security:
      - cookieAuth: []
      - basicAuth: []
      - tokenAuth: []
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    delete:
      operationId: employees_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee.
        required: true
      tags:
      - pegasus
      security:
      - cookieAuth: []
      - basicAuth: []
      - tokenAuth: []
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /users/profile/api/:
    get:
      operationId: users_profile_api_retrieve
      description: |-
        API endpoint to get and update user profile details.
        Returns all personal details stored in the database.

        This endpoint uses token-based authentication (Token or JWT) to avoid CSRF requirements.
        It's designed for API clients (mobile apps) that use token authentication.
      tags:
      - users
      security:
      - tokenAuth: []
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: users_profile_api_update
      description: |-
        API endpoint to get and update user profile details.
        Returns all personal details stored in the database.

        This endpoint uses token-based authentication (Token or JWT) to avoid CSRF requirements.
        It's designed for API clients (mobile apps) that use token authentication.
      tags:
      - users
      security:
      - tokenAuth: []
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: users_profile_api_partial_update
      description: |-
        API endpoint to get and update user profile details.
        Returns all personal details stored in the database.

        This endpoint uses token-based authentication (Token or JWT) to avoid CSRF requirements.
        It's designed for API clients (mobile apps) that use token authentication.
      tags:
      - users
      security:
      - tokenAuth: []
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    AggregateEmployeeData:
      type: object
      properties:
        total_costs: {}
        average_salaries: {}
        headcounts: {}
      required:
      - average_salaries
      - headcounts
      - total_costs
    CustomLogin:
      type: object
      description: |-
        Custom login serializer that accepts both email and username.
        Since the app uses email authentication, we prioritize email but also support username.
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - password
    CustomUser:
      type: object
      description: |-
        Basic serializer to pass CustomUser details to the front end.
        Extend with any fields your app needs.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        avatar_url:
          type: string
          readOnly: true
        get_display_name:
          type: string
          readOnly: true
        language:
          type: string
          nullable: true
          maxLength: 10
        timezone:
          type: string
          maxLength: 100
        date_joined:
          type: string
          format: date-time
          readOnly: true
        is_email_verified:
          type: string
          readOnly: true
      required:
      - avatar_url
      - date_joined
      - get_display_name
      - id
      - is_email_verified
      - username
    DepartmentEnum:
      enum:
      - hr
      - finance
      - engineering
      - marketing
      - sales
      type: string
      description: |-
        * `hr` - Human Resources
        * `finance` - Finance
        * `engineering` - Engineering
        * `marketing` - Marketing
        * `sales` - Sales
    Employee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        name:
          type: string
          description: Your employee's name.
          maxLength: 100
        department:
          $ref: '#/components/schemas/DepartmentEnum'
        salary:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Your employee's annual salary.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department
      - id
      - name
      - salary
      - updated_at
      - user
    JWT:
      type: object
      description: Serializer for JWT authentication.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/CustomUser'
      required:
      - access
      - refresh
      - user
    OtpRequest:
      type: object
      properties:
        temp_otp_token:
          type: string
        otp:
          type: string
      required:
      - otp
      - temp_otp_token
    PaginatedEmployeeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
    PasswordChange:
      type: object
      properties:
        new_password1:
          type: string
          maxLength: 128
        new_password2:
          type: string
          maxLength: 128
      required:
      - new_password1
      - new_password2
    PatchedCustomUser:
      type: object
      description: |-
        Basic serializer to pass CustomUser details to the front end.
        Extend with any fields your app needs.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        avatar_url:
          type: string
          readOnly: true
        get_display_name:
          type: string
          readOnly: true
        language:
          type: string
          nullable: true
          maxLength: 10
        timezone:
          type: string
          maxLength: 100
        date_joined:
          type: string
          format: date-time
          readOnly: true
        is_email_verified:
          type: string
          readOnly: true
    PatchedEmployee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        name:
          type: string
          description: Your employee's name.
          maxLength: 100
        department:
          $ref: '#/components/schemas/DepartmentEnum'
        salary:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Your employee's annual salary.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
          minLength: 1
        email:
          type: string
          format: email
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
      required:
      - email
      - password1
      - password2
    RestAuthDetail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UserSignupStats:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - date
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
